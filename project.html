<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOWTHAM C D</title>

    <link href="https://cdn.boxicons.com/fonts/basic/boxicons.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./CSS/project.css" />
</head>

<body>

    <nav>
        <div class="nav-logo">
            <img src="../IMAGE/PFP.jpg" alt="Profile" />
        </div>

        <div class="nav-center">
            <ul class="left">
                <li><a href="./index.html">HOME</a></li>
                <li><a href="./index.html#about">ABOUT</a></li>
            </ul>

            <div class="nav-content">
                <p>PROJECT</p>
            </div>

            <ul class="left">
                <li><a href="./contact.html">CONTACT</a></li>
                <li><a href="./project.html">PROJECT</a></li>
            </ul>
        </div>

        <div class="nav-setting">
            <i class="bx bx-menu bx-lg"></i>
        </div>
    </nav>

    <div class="content">

        <div class="projecthead">
            <h1>Projects</h1>
            <p>Explore my works</p>
        </div>

        <div class="project">

            <div class="projectleft" id="projectLeft"></div>
            <div class="projectmid" id="projectMid"></div>
            <div class="projectright" id="projectRight"></div>

        </div>
    </div>

    <script>
        const projects = [
            {
                name: "YouTube UI Clone",
                from: "January 10 2025",
                to: "January 11 2025",
                status: "Completed",
                link: "#"
            },
            {
                name: "Portfolio Website",
                from: "January 15 2025",
                to: "February 10 2025",
                status: "Under Progress",
                link: "#"
            },
            {
                name: "E-commerce App",
                from: "February 12 2025",
                to: "March 10 2025",
                status: "Under Progress",
                link: "#"
            },
            {
                name: "Chat Application",
                from: "March 1 2025",
                to: "March 20 2025",
                status: "Completed",
                link: "#"
            }
        ];

        const left = document.getElementById("projectLeft");
        const right = document.getElementById("projectRight");
        const mid = document.getElementById("projectMid");

        projects.forEach((project, index) => {

            const card = document.createElement("div");
            card.className = index % 2 === 0
                ? "projectcontainer"
                : "projectcontainerright";

            card.innerHTML = `
                <div class="date">
                    From : ${project.from} &nbsp;&nbsp; - &nbsp;&nbsp; ${project.to}
                </div>
                <div class="name">
                    <h1>${project.name}</h1>
                </div>
                <div class="status">
                    <p id="${project.status === 'Completed' ? 'not' : 'yep'}">
                        ${project.status}
                    </p>
                </div>
                <a href="${project.link}" target="_blank">Link</a>
            `;

            index % 2 === 0 ? left.appendChild(card) : right.appendChild(card);

            const point = document.createElement("div");
            point.className = "point";
            if (index < projects.length - 1) {
                point.innerHTML = `
                ${index !== 0 ? '<div class="line"></div>' : ''}
                <i class='bxr bx-shield-circle'></i>
            `;
                mid.appendChild(point);
            }

        });
    </script>

</body>

</html>
